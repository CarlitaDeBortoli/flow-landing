<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descarga Flow | App Store / Google Play</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #612FA1, #885BFD);
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .box { max-width: 360px; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,.35);
      border-top-color: #78DEE8;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.2rem; margin: 0 0 10px; }
    p { color: rgba(255,255,255,.85); font-size: .9rem; margin: 0 0 18px; }
    a.manual-link { color: #78DEE8; font-weight: 600; text-decoration: none; }
    a.manual-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Te llevamos a tu tienda de apps…</h1>
    <p>Si no se abre automáticamente, tocá el enlace de abajo.</p>
    <a class="manual-link" id="manual-link" href="https://play.google.com/store/apps">Ir a la tienda</a>
  </div>

  <script>
    (function () {
      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent || '');
      var storeUrl = isIOS ? 'https://www.apple.com/app-store/' : 'https://play.google.com/store/apps';
      document.getElementById('manual-link').href = storeUrl;
      window.location.replace(storeUrl);
    })();
  </script>
</body>
</html>
